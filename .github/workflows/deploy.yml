name: Build, Push and Deploy Talazan Storefront

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Resmi action’lar (checkout, docker/*) Node 24 ile çalışsın; Node 20 kaldırılmadan önce uyumluluğu test eder.
    # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ secrets.GHCR_USERNAME }}/talazan-storefront:${{ steps.vars.outputs.sha_short }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://talazan-pes-server:8080/api' }}
            API_INTERNAL_URL=${{ secrets.API_INTERNAL_URL || 'http://talazan-pes-server:8080/api' }}
          cache-from: type=registry,ref=ghcr.io/${{ secrets.GHCR_USERNAME }}/talazan-storefront:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ secrets.GHCR_USERNAME }}/talazan-storefront:buildcache,mode=max

      - name: SSH & Deploy Storefront Container
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ghcr.io/${{ secrets.GHCR_USERNAME }}/talazan-storefront:${{ steps.vars.outputs.sha_short }}

            docker rm -f talazan-storefront || true

            docker run -d \
              --name talazan-storefront \
              --restart unless-stopped \
              --memory="512m" \
              --memory-swap="512m" \
              --cpus="0.25" \
              -v /etc/localtime:/etc/localtime:ro \
              -v /etc/timezone:/etc/timezone:ro \
              --network root_my_network \
              -p 3000:3000 \
              -e API_INTERNAL_URL=${{ secrets.API_INTERNAL_URL || 'http://talazan-pes-server:8080/api' }} \
              ghcr.io/${{ secrets.GHCR_USERNAME }}/talazan-storefront:${{ steps.vars.outputs.sha_short }}
